# Generated by @google/jules-fleet with strict spending guardrails
name: Fleet Dispatch

on:
  # Recurring cron schedule disabled to prevent unintended automated API spending
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone ID to dispatch (leave empty to dispatch default)'
        type: string
        required: false
      dry_run:
        description: 'Simulate without creating live API sessions (Safe default: true)'
        type: boolean
        default: true
        required: true
      max_tasks:
        description: 'Hard limit on Jules tasks to spin up (Max safe ceiling: 3)'
        type: number
        default: 2
        required: true

concurrency:
  group: fleet-dispatch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      milestones: ${{ steps.list.outputs.milestones }}
    steps:
      - name: Resolve milestones
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MILESTONE: ${{ inputs.milestone }}
        run: |
          if [ -n "$INPUT_MILESTONE" ]; then
            echo "milestones=[\"$INPUT_MILESTONE\"]" >> "$GITHUB_OUTPUT"
          else
            # Limit discovery to at most 1 milestone per run
            milestones=$(gh api repos/${{ github.repository }}/milestones --jq '[.[0].number | tostring] // []')
            echo "milestones=$milestones" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # Strictly sequential: max 1 milestone at a time to prevent runaway parallel charges
      max-parallel: 1
      matrix:
        milestone: ${{ fromJSON(needs.discover.outputs.milestones) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dispatch Jules Fleet with Spending Controls
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx -y --package=@google/jules-fleet jules-fleet dispatch \
            --milestone ${{ matrix.milestone }} \
            --concurrency 2 \
            --max-sessions ${{ inputs.max_tasks || 2 }} \
            $DRY_RUN_FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
          FLEET_APP_PRIVATE_KEY_BASE64: ${{ secrets.FLEET_APP_PRIVATE_KEY_BASE64 }}
          FLEET_APP_INSTALLATION_ID: ${{ secrets.FLEET_APP_INSTALLATION_ID }}
